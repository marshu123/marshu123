name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_1 }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Drop invalid cards
        run: |
          for f in profile/stats.svg profile/top-langs.svg; do
            if [ ! -f "$f" ] || grep -q "Something went wrong" "$f"; then
              echo "::warning::$f invalid or missing (upstream rate limit) - not committing it"
              git checkout -- "$f" 2>/dev/null || git rm -q --cached "$f" 2>/dev/null || true
            fi
          done
          exit 0

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile/
          git diff --staged --quiet || git commit -m "Update README cards"
          git push
